<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="OpenDash">
  <title>OpenDash</title>
  <!--
    The mark is the dash itself: a housing wider than it is tall, square across the bottom and
    closed over the top by a half circle, with a tachometer needle swept up and to the right in it.

    The top is a true half circle rather than a pair of rounded corners: its radius is 15, which is
    exactly half the housing's 30 width, so the arc spans the whole width in one sweep and the
    straight sides are the 7 units left under it. One arc, not three segments.

    It is one shape with one hole. The housing is the outer subpath, the needle the inner one, and
    `fill-rule="evenodd"` cuts the second out of the first, so the needle is the background showing
    through rather than a second colour. That is what lets the mark sit on the near-black panel and
    on the README's white without being drawn twice.

    The needle is a real needle rather than a wedge: a round hub of radius 3 at the pivot, and two
    lines running from the hub's own tangent points out to a single point. Tangents, so the blade
    leaves the hub smoothly instead of stepping off it, which is the difference between a needle and
    a comma at 24 px. It pivots at 16,20, which is the half circle's own centre, so the needle and
    the roof share a centre of curvature and the point always aims at the arc.

    The sizes are held by what survives a browser tab at 16 px, where one unit is half a pixel. The
    hub is 6 units across, the housing 22 units tall, the point stands 3 units clear of the arc and
    the hub 4 units clear of the floor, so nothing merges with the housing at that size. The needle
    tapers to nothing on purpose, which is the one place the four-unit floor does not apply: a taper
    is read from the body behind it.

    Square across the bottom is `radius.none`; the half circle is the one curve the brand allows
    itself, and it is what makes the silhouette a dash rather than a box.

    The single colour is design/tokens.json's purpose.ui.accent, which Theme.Accent mirrors. A mark
    with a hex of its own would be a second palette; anything that draws this in another colour
    should set `fill` on the path rather than edit the geometry.

    The path is MarkShape.PathData in the plugin, character for character, and MarkTests compares
    the two. Change this file first.
  -->
  <path fill="#33D9F2" fill-rule="evenodd" d="M1,27 L1,20 A15,15 0 0 1 31,20 L31,27 Z M14.173,17.621 L23.388,10.544 L18.751,21.197 A3,3 0 1 1 14.173,17.621 Z" />
</svg>

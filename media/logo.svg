<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="OpenDash">
  <title>OpenDash</title>
  <!--
    The mark is the rev bar, which is the one shape OpenDash owns: five segments lit left to right
    as the revs rise. It is drawn as five rounded bars of increasing height on a common baseline,
    so that it reads as a sweep at any size and as a shape rather than as a colour when it is
    monochrome. Nothing here is thinner than 4 units of 32, which is what keeps it legible at 16 px.

    The single colour is design/tokens.json's purpose.ui.accent, which Theme.Accent mirrors. A mark with a hex of its own
    would be a second palette; anything that draws this in another colour should set `fill` on the
    group rather than edit the bars.
  -->
  <g fill="#33D9F2">
    <rect x="1"  y="20" width="5" height="8"  rx="2" />
    <rect x="8"  y="16" width="5" height="12" rx="2" />
    <rect x="15" y="12" width="5" height="16" rx="2" />
    <rect x="22" y="7"  width="5" height="21" rx="2" />
  </g>
  <!-- The fifth segment is separated and squarer: it is the shift point, the one a driver acts on. -->
  <rect x="29" y="2" width="2" height="26" rx="1" fill="#33D9F2" />
</svg>

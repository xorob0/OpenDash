<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; background: #0A0B0D; color: #F5F7FA; font-family: Barlow, system-ui, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #F5F7FA; } a:hover { color: #8A9099; }
    .lbl { font-family: Barlow, system-ui, sans-serif; font-weight: 500; font-size: 15px; line-height: 1; text-transform: uppercase; color: #5A6069; white-space: nowrap; }
    .lbl-sm { font-family: Barlow, system-ui, sans-serif; font-weight: 500; font-size: 13px; line-height: 1; text-transform: uppercase; color: #8A9099; white-space: nowrap; }
    .num { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; color: #F5F7FA; white-space: nowrap; }
    .slotbox { box-sizing: border-box; }
    .card { display: flex; flex-direction: column; gap: 4px; box-sizing: border-box; height: 100%; justify-content: center; background: #0A0B0D; }
    .row { display: flex; align-items: baseline; gap: 8px; }
    .grid4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 16px; }
    .seg { flex: 1 1 0; border-radius: 2px; }
  </style>
</helmet>
<!-- 800 x 286 . nano . 4 slots, gear steps to gearSm 180 and speed to 64 -->
<div style="position: relative; width: 800px; height: 286px; background: #0A0B0D; overflow: hidden;">

  <div style="position: absolute; left: 16px; top: 10px; width: 768px; height: 32px; display: flex; gap: 4px;">
    <sc-for list="{{segments}}" as="seg" hint-placeholder-count="15">
      <div class="seg" style="height: 32px; background: {{seg.color}};"></div>
    </sc-for>
  </div>
  <div style="position: absolute; left: 0; top: 54px; width: 800px; height: 1px; background: #1C1F24;"></div>

  <div style="position: absolute; left: 0; top: 55px; width: 800px; height: 219px; display: flex; justify-content: center;">
    <div style="width: 250px; height: 219px; flex: none; display: grid; grid-template-columns: repeat(1, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 1px; background: #1C1F24;"><div class="slotbox" style="width: 250px; height: 109px; background: #0A0B0D;"><div class="card" style="padding: 6px 12px;"><div class="lbl">Current</div><div class="num" style="font-size: 46px;">1:42.3</div></div></div><div class="slotbox" style="width: 250px; height: 109px; background: #0A0B0D;"><div class="card" style="padding: 6px 12px;"><div class="lbl">Last</div><div class="num" style="font-size: 46px;">1:42.905</div></div></div></div>
    <div style="width: 1px; height: 219px; background: #1C1F24; flex: none;"></div>
    <div style="width: 298px; height: 219px; flex: none; display: flex; align-items: center; justify-content: center; gap: 20px; box-sizing: border-box;">
      <div class="num" style="font-size: 180px; font-weight: 700;">4</div>
      <div style="display: flex; flex-direction: column; gap: 6px;"><div class="num" style="font-size: 64px;">187</div><div class="lbl-sm">km/h</div></div>
    </div>
    <div style="width: 1px; height: 219px; background: #1C1F24; flex: none;"></div>
    <div style="width: 250px; height: 219px; flex: none; display: grid; grid-template-columns: repeat(1, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 1px; background: #1C1F24;"><div class="slotbox" style="width: 250px; height: 109px; background: #0A0B0D;"><div class="card" style="padding: 6px 12px;"><div class="lbl">Best</div><div class="num" style="font-size: 46px;">1:41.877</div></div></div><div class="slotbox" style="width: 250px; height: 109px; background: #0A0B0D;"><div class="card" style="padding: 6px 12px;"><div class="lbl">Delta</div><div class="num" style="font-size: 46px; color: #00D96A;">−0.21</div></div></div></div>
  </div>

  <sc-if value="{{pitLimiter}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 274px; top: 65px; width: 252px; height: 28px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
      <div class="lbl" style="color: #0A0B0D;">Pit limiter</div>
    </div>
  </sc-if>

  <div style="position: absolute; left: 0; top: 274px; width: 800px; height: 12px; background: {{flagBg}}; border: 2px solid {{flagBorder}}; box-sizing: border-box;"></div>
</div>
</x-dc>
<script data-dc-script data-props='{"litSegments":{"editor":"range","default":9,"min":0,"max":15,"step":1,"section":"Rev bar"},"flag":{"editor":"enum","default":"none","options":["none","black","chequer","yellow","blue","white","green"],"section":"Indicators"},"pitLimiter":{"editor":"boolean","default":false,"section":"Indicators"},"$preview":{"width":800,"height":286}}'>
class Component extends DCLogic {
  renderVals() {
    const lit = Math.max(0, Math.min(15, Number(this.props.litSegments ?? 9)));
    // Band boundaries are SimHub per-car values (RPMShiftLight1, RPMShiftLight2, redline); 5/5/5 is only the sample.
    const stageColor = (i) => (i < 5 ? '#00D96A' : i < 10 ? '#FFB300' : '#FF2D46');
    const segments = Array.from({ length: 15 }, (_, i) => ({ color: i < lit ? stageColor(i) : '#33383F', angle: -84 + i * 12 }));
    const fills = { none: 'transparent', yellow: '#FFD400', blue: '#2E7BFF', white: '#FFFFFF', green: '#00D96A',
      chequer: 'repeating-conic-gradient(#F5F7FA 0 25%, #0A0B0D 0 50%) 0 0 / 12px 12px' };
    const flag = this.props.flag ?? 'none';
    // the black flag is an outlined band, since a black fill would vanish on this face
    const isBlack = flag === 'black';
    return { segments, flagBg: isBlack ? '#0A0B0D' : (fills[flag] ?? 'transparent'), flagBorder: isBlack ? '#F5F7FA' : 'transparent', ringInner: isBlack ? '#0A0B0D' : 'transparent',
      isYellow: flag === 'yellow', isBlue: flag === 'blue', isWhite: flag === 'white', isGreen: flag === 'green', isBlack, pitLimiter: !!this.props.pitLimiter };
  }
}
</script>
</body>
</html>

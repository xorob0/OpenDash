<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; background: #0A0B0D; color: #F5F7FA; font-family: Barlow, system-ui, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #F5F7FA; } a:hover { color: #8A9099; }
    .lbl { font-family: Barlow, system-ui, sans-serif; font-weight: 500; font-size: 15px; line-height: 1; text-transform: uppercase; color: #5A6069; white-space: nowrap; }
    .lbl-sm { font-family: Barlow, system-ui, sans-serif; font-weight: 500; font-size: 13px; line-height: 1; text-transform: uppercase; color: #8A9099; white-space: nowrap; }
    .num { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; color: #F5F7FA; white-space: nowrap; }
    .slotbox { box-sizing: border-box; }
    .card { display: flex; flex-direction: column; gap: 4px; box-sizing: border-box; height: 100%; justify-content: center; background: #0A0B0D; }
    .row { display: flex; align-items: baseline; gap: 8px; }
    .grid4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 16px; }
    .seg { flex: 1 1 0; border-radius: 2px; }
  </style>
</helmet>
<!-- 800 x 286 . nano . no settings bar: the height is not there, so the band carries the one changeable zone -->
<div style="position: relative; width: 800px; height: 286px; background: #0A0B0D; overflow: hidden;">

  <div style="position: absolute; left: 6px; top: 1px; width: 788px; height: 30px; background: #060708;"></div>
  <div style="position: absolute; left: 12px; top: 5px; width: 776px; height: 22px; display: flex; gap: 4px;">
    <sc-for list="{{segments}}" as="seg" hint-placeholder-count="15">
      <div class="seg" style="height: 22px; background: {{seg.color}};"></div>
    </sc-for>
  </div>
  <div style="position: absolute; left: 0; top: 32px; width: 800px; height: 1px; background: #1C1F24;"></div>
<div style="position: absolute; left: 0px; top: 33px; width: 269px; height: 194px; box-sizing: border-box; padding: 6px 12px; display: flex; flex-direction: column; gap: 4px; overflow: hidden;"><div style="height: 22px; display: flex; align-items: baseline; gap: 8px; flex: none;"><div class="lbl" style="color: #5A6069;">B</div><div class="lbl">Delta</div></div><div style="flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; overflow: hidden;"><div style="display: flex; flex-direction: column; gap: 14px; "><div style="display: flex; flex-direction: column; gap: 2px; "><div class="num" style="font-size: 46px; color: #00D96A;">−0.21</div><div class="lbl">vs session best</div></div><div style="position: relative; width: 237px; height: 10px; background: #1C1F24;"><div style="position: absolute; left: 0%; top: -4px; width: 1px; height: 18px; background: #33383F;"></div><div style="position: absolute; left: 25%; top: -4px; width: 1px; height: 18px; background: #33383F;"></div><div style="position: absolute; left: 75%; top: -4px; width: 1px; height: 18px; background: #33383F;"></div><div style="position: absolute; left: 100%; top: -4px; width: 1px; height: 18px; background: #33383F;"></div><div style="position: absolute; left: 44%; width: 5%; top: 0; height: 10px; background: #00D96A;"></div><div style="position: absolute; left: 50%; top: -6px; width: 2px; height: 22px; background: #F5F7FA;"></div></div></div></div></div>  <div style="position: absolute; left: 269px; top: 33px; width: 1px; height: 194px; background: #1C1F24;"></div>
<div style="position: absolute; left: 270px; top: 33px; width: 260px; height: 194px; overflow: hidden;"><div style="height: 194px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;"><div style="display: flex; align-items: center; justify-content: center; gap: 8px;"><div class="num" style="font-size: 50px; color: #33383F; font-weight: 600;">3</div><div class="num" style="font-size: 120px; font-weight: 700;">4</div><div class="num" style="font-size: 50px; color: #33383F; font-weight: 600;">5</div></div><div style="display: flex; align-items: baseline; justify-content: center; gap: 8px;"><div class="num" style="font-size: 36px;">187</div><div class="lbl-sm">km/h</div></div></div></div>
    <div style="position: absolute; left: 530px; top: 33px; width: 1px; height: 194px; background: #1C1F24;"></div>
<div style="position: absolute; left: 531px; top: 33px; width: 269px; height: 194px; box-sizing: border-box; padding: 6px 12px; display: flex; flex-direction: column; gap: 4px; overflow: hidden;"><div style="height: 22px; display: flex; align-items: baseline; gap: 8px; flex: none;"><div class="lbl" style="color: #5A6069;">C</div><div class="lbl">Fuel</div></div><div style="flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; overflow: hidden;"><div style="display: flex; flex-direction: column; gap: 8px; "><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; "><div style="display: flex; flex-direction: column; gap: 5px;"><div style="height: 13px; display: flex; align-items: center;"><div class="lbl">Fuel</div></div><div style="height: 34px; display: flex; align-items: center;"><div class="row" style="align-items: baseline; gap: 6px;"><div class="num" style="font-size: 34px;">38.4</div><div class="lbl-sm">L</div></div></div></div><div style="display: flex; flex-direction: column; gap: 5px;"><div style="height: 13px; display: flex; align-items: center;"><div class="lbl">Fuel time</div></div><div style="height: 34px; display: flex; align-items: center;"><div class="num" style="font-size: 34px;">0:31:40</div></div></div></div></div></div></div>  <div style="position: absolute; left: 0; top: 227px; width: 800px; height: 1px; background: #1C1F24;"></div>
  <div style="position: absolute; left: 0; top: 228px; width: 800px; height: 58px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 16px; background: #060708;"><div class="lbl" style="color: #5A6069; flex: none;">D</div><div style="display: flex; align-items: center; gap: 22px; width: 100%; height: 50px;"><div style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 26px;"><div style="display: flex; flex-direction: column; gap: 5px; align-items: flex-start; "><div class="lbl" style="height: 13px; display: flex; align-items: center;">Fuel</div><div style="height: 34px; display: flex; align-items: center;"><div class="row" style="gap: 5px; align-items: baseline;"><div class="num" style="font-size: 34px;">15.12</div><div class="lbl-sm">L</div></div></div></div><div style="display: flex; flex-direction: column; gap: 5px; align-items: flex-start; "><div class="lbl" style="height: 13px; display: flex; align-items: center;">Fuel time</div><div style="height: 34px; display: flex; align-items: center;"><div class="num" style="font-size: 34px;">08:46</div></div></div><div style="display: flex; flex-direction: column; gap: 5px; align-items: flex-start; "><div class="lbl" style="height: 13px; display: flex; align-items: center;">Est. laps</div><div style="height: 34px; display: flex; align-items: center;"><div class="num" style="font-size: 34px;">13.1</div></div></div><div style="display: flex; flex-direction: column; gap: 5px; align-items: flex-start; "><div class="lbl" style="height: 13px; display: flex; align-items: center;">Refuel</div><div style="height: 34px; display: flex; align-items: center;"><div class="num" style="font-size: 34px; color: #FFB300;">32.67</div></div></div></div></div></div>
  <sc-if value="{{pitLimiter}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 294px; top: 39px; width: 212px; height: 30px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
      <div class="lbl" style="color: #0A0B0D;">Pit limiter</div>
    </div>
  </sc-if>

  <div style="position: absolute; left: 0; top: 228px; width: 800px; height: 58px; background: {{flagBg}}; border: 3px solid {{flagBorder}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center;">
    <sc-if value="{{isYellow}}" hint-placeholder-val="{{false}}"><div class="lbl" style="color: #0A0B0D;">Yellow flag</div></sc-if>
    <sc-if value="{{isBlue}}" hint-placeholder-val="{{false}}"><div class="lbl" style="color: #0A0B0D;">Blue flag</div></sc-if>
    <sc-if value="{{isWhite}}" hint-placeholder-val="{{false}}"><div class="lbl" style="color: #0A0B0D;">White flag</div></sc-if>
    <sc-if value="{{isGreen}}" hint-placeholder-val="{{false}}"><div class="lbl" style="color: #0A0B0D;">Green flag</div></sc-if>
    <sc-if value="{{isBlack}}" hint-placeholder-val="{{false}}"><div class="lbl" style="color: #F5F7FA;">Black flag</div></sc-if>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"litSegments":{"editor":"range","default":9,"min":0,"max":15,"step":1,"section":"Rev bar"},"flag":{"editor":"enum","default":"none","options":["none","black","chequer","yellow","blue","white","green"],"section":"Indicators"},"pitLimiter":{"editor":"boolean","default":false,"section":"Indicators"},"$preview":{"width":800,"height":286}}'>
class Component extends DCLogic {
  renderVals() {
    const lit = Math.max(0, Math.min(15, Number(this.props.litSegments ?? 9)));
    // Band boundaries are SimHub per-car values (RPMShiftLight1, RPMShiftLight2, redline); 5/5/5 is only the sample.
    const stageColor = (i) => (i < 5 ? '#00D96A' : i < 10 ? '#FFB300' : '#FF2D46');
    const segments = Array.from({ length: 15 }, (_, i) => ({ color: i < lit ? stageColor(i) : '#33383F', angle: -84 + i * 12 }));
    const fills = { none: 'transparent', yellow: '#FFD400', blue: '#2E7BFF', white: '#FFFFFF', green: '#00D96A',
      chequer: 'repeating-conic-gradient(#F5F7FA 0 25%, #0A0B0D 0 50%) 0 0 / 58px 58px' };
    const flag = this.props.flag ?? 'none';
    // the black flag is an outlined band, since a black fill would vanish on this face
    const isBlack = flag === 'black';
    return { segments, flagBg: isBlack ? '#0A0B0D' : (fills[flag] ?? 'transparent'), flagBorder: isBlack ? '#F5F7FA' : 'transparent', ringInner: isBlack ? '#0A0B0D' : 'transparent',
      isYellow: flag === 'yellow', isBlue: flag === 'blue', isWhite: flag === 'white', isGreen: flag === 'green', isBlack, pitLimiter: !!this.props.pitLimiter };
  }
}
</script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; background: #0A0B0D; color: #F5F7FA; font-family: Barlow, system-ui, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #F5F7FA; } a:hover { color: #8A9099; }
    .lbl { font-family: Barlow, system-ui, sans-serif; font-weight: 500; font-size: 15px; line-height: 1; text-transform: uppercase; color: #5A6069; white-space: nowrap; }
    .lbl-sm { font-family: Barlow, system-ui, sans-serif; font-weight: 500; font-size: 13px; line-height: 1; text-transform: uppercase; color: #8A9099; white-space: nowrap; }
    .num { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; color: #F5F7FA; white-space: nowrap; }
    .slotbox { box-sizing: border-box; }
    .card { display: flex; flex-direction: column; gap: 4px; box-sizing: border-box; height: 100%; justify-content: center; background: #0A0B0D; }
    .row { display: flex; align-items: baseline; gap: 8px; }
    .grid4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 16px; }
    .seg { flex: 1 1 0; border-radius: 2px; }
  </style>
</helmet>
<!-- 1920 x 480 . MVP . hero column plus 12 slots, 3 by 2 per side, rung L -->
<div style="position: relative; width: 1920px; height: 480px; background: #0A0B0D; overflow: hidden;">

  <div style="position: absolute; left: 24px; top: 12px; width: 1872px; height: 40px; display: flex; gap: 8px;">
    <sc-for list="{{segments}}" as="seg" hint-placeholder-count="15">
      <div class="seg" style="height: 40px; background: {{seg.color}};"></div>
    </sc-for>
  </div>
  <div style="position: absolute; left: 0; top: 64px; width: 1920px; height: 1px; background: #1C1F24;"></div>

  <div style="position: absolute; left: 0; top: 65px; width: 1920px; height: 375px; display: flex; justify-content: center;">
    <div style="width: 767px; height: 375px; flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 1px; background: #1C1F24;"><div class="slotbox" style="width: 255px; height: 187px; background: #0A0B0D;"><div class="card" style="padding: 12px 16px;"><div class="lbl">Current</div><div class="num" style="font-size: 64px;">1:42.3</div></div></div><div class="slotbox" style="width: 255px; height: 187px; background: #0A0B0D;"><div class="card" style="padding: 12px 16px;"><div class="lbl">Last</div><div class="num" style="font-size: 64px;">1:42.905</div></div></div><div class="slotbox" style="width: 255px; height: 187px; background: #0A0B0D;"><div class="card" style="padding: 12px 16px;"><div class="lbl">Best</div><div class="num" style="font-size: 64px;">1:41.877</div></div></div><div class="slotbox" style="width: 255px; height: 187px; background: #0A0B0D;"><div class="card" style="padding: 12px 16px;"><div class="lbl">Delta</div><div class="num" style="font-size: 64px; color: #00D96A;">−0.21</div></div></div><div class="slotbox" style="width: 255px; height: 187px; background: #0A0B0D;"><div class="card" style="padding: 12px 16px;"><div class="lbl">Position</div><div class="row"><div class="num" style="font-size: 64px;">3</div><div class="num" style="font-size: 46px; color: #8A9099;">/ 24</div></div></div></div><div class="slotbox" style="width: 255px; height: 187px; background: #0A0B0D;"><div class="card" style="padding: 12px 16px;"><div class="lbl">Lap</div><div class="row"><div class="num" style="font-size: 64px;">12</div><div class="num" style="font-size: 46px; color: #8A9099;">/ 30</div></div></div></div></div>
    <div style="width: 1px; height: 375px; background: #1C1F24; flex: none;"></div>
    <div style="width: 382px; height: 375px; flex: none; display: flex; align-items: center; justify-content: center; gap: 24px; box-sizing: border-box;">
      <div class="num" style="font-size: 260px; font-weight: 700;">4</div>
      <div style="display: flex; flex-direction: column; gap: 6px;"><div class="num" style="font-size: 116px;">187</div><div class="lbl-sm">km/h</div></div>
    </div>
    <div style="width: 1px; height: 375px; background: #1C1F24; flex: none;"></div>
    <div style="width: 767px; height: 375px; flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 1px; background: #1C1F24;"><div class="slotbox" style="width: 255px; height: 187px; background: #0A0B0D;"><div class="card" style="padding: 12px 16px;"><div class="lbl">Fuel</div><div class="row"><div class="num" style="font-size: 64px;">38.4</div><div class="lbl-sm">L</div></div></div></div><div class="slotbox" style="width: 255px; height: 187px; background: #0A0B0D;"><div class="card" style="padding: 12px 16px;"><div class="lbl">Fuel laps</div><div class="num" style="font-size: 64px;">11.2</div></div></div><div class="slotbox" style="width: 255px; height: 187px; background: #0A0B0D;"><div class="card" style="padding: 12px 16px;"><div class="lbl">TC</div><div class="num" style="font-size: 64px;">3</div></div></div><div class="slotbox" style="width: 255px; height: 187px; background: #0A0B0D;"><div class="card" style="padding: 12px 16px;"><div class="lbl">ABS</div><div class="num" style="font-size: 64px;">2</div></div></div><div class="slotbox" style="width: 255px; height: 187px; background: #0A0B0D;"><div class="card" style="padding: 12px 16px;"><div class="lbl">Tyres °C · last stop</div><div class="grid4"><div class="num" style="font-size: 46px;">84</div><div class="num" style="font-size: 46px; color: #FF2D46;">104</div><div class="num" style="font-size: 46px; color: #2E7BFF;">62</div><div class="num" style="font-size: 46px;">88</div></div></div></div><div class="slotbox" style="width: 255px; height: 187px; background: #0A0B0D;"><div class="card" style="padding: 12px 16px;"><div class="lbl">Pressures psi · last stop</div><div class="grid4"><div class="num" style="font-size: 46px;">27.8</div><div class="num" style="font-size: 46px;">28.6</div><div class="num" style="font-size: 46px;">27.1</div><div class="num" style="font-size: 46px;">27.9</div></div></div></div></div>
  </div>

  <sc-if value="{{pitLimiter}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 824px; top: 75px; width: 272px; height: 36px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
      <div class="lbl" style="color: #0A0B0D;">Pit limiter</div>
    </div>
  </sc-if>

  <div style="position: absolute; left: 0; top: 440px; width: 1920px; height: 40px; background: {{flagBg}}; border: 3px solid {{flagBorder}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center;">
    <sc-if value="{{isYellow}}" hint-placeholder-val="{{false}}"><div class="lbl" style="color: #0A0B0D;">Yellow flag</div></sc-if>
    <sc-if value="{{isBlue}}" hint-placeholder-val="{{false}}"><div class="lbl" style="color: #0A0B0D;">Blue flag</div></sc-if>
    <sc-if value="{{isWhite}}" hint-placeholder-val="{{false}}"><div class="lbl" style="color: #0A0B0D;">White flag</div></sc-if>
    <sc-if value="{{isGreen}}" hint-placeholder-val="{{false}}"><div class="lbl" style="color: #0A0B0D;">Green flag</div></sc-if>
    <sc-if value="{{isBlack}}" hint-placeholder-val="{{false}}"><div class="lbl" style="color: #F5F7FA;">Black flag</div></sc-if>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"litSegments":{"editor":"range","default":9,"min":0,"max":15,"step":1,"section":"Rev bar"},"flag":{"editor":"enum","default":"none","options":["none","black","chequer","yellow","blue","white","green"],"section":"Indicators"},"pitLimiter":{"editor":"boolean","default":false,"section":"Indicators"},"$preview":{"width":1920,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const lit = Math.max(0, Math.min(15, Number(this.props.litSegments ?? 9)));
    // Band boundaries are SimHub per-car values (RPMShiftLight1, RPMShiftLight2, redline); 5/5/5 is only the sample.
    const stageColor = (i) => (i < 5 ? '#00D96A' : i < 10 ? '#FFB300' : '#FF2D46');
    const segments = Array.from({ length: 15 }, (_, i) => ({ color: i < lit ? stageColor(i) : '#33383F', angle: -84 + i * 12 }));
    const fills = { none: 'transparent', yellow: '#FFD400', blue: '#2E7BFF', white: '#FFFFFF', green: '#00D96A',
      chequer: 'repeating-conic-gradient(#F5F7FA 0 25%, #0A0B0D 0 50%) 0 0 / 40px 40px' };
    const flag = this.props.flag ?? 'none';
    // the black flag is an outlined band, since a black fill would vanish on this face
    const isBlack = flag === 'black';
    return { segments, flagBg: isBlack ? '#0A0B0D' : (fills[flag] ?? 'transparent'), flagBorder: isBlack ? '#F5F7FA' : 'transparent', ringInner: isBlack ? '#0A0B0D' : 'transparent',
      isYellow: flag === 'yellow', isBlue: flag === 'blue', isWhite: flag === 'white', isGreen: flag === 'green', isBlack, pitLimiter: !!this.props.pitLimiter };
  }
}
</script>
</body>
</html>

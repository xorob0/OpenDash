# release.yml: on a tag v*, checks the tag against VERSION, runs the same build steps as ci.yml,
# then publishes a GitHub release carrying every .simhubdash package and OpenDash-plugin.zip.
# A tag whose version carries a pre-release suffix (v0.1.0-rc.1) publishes as a pre-release, so a
# release candidate is never the download a first-time user is offered.
# Only the final job holds a token that can write to the repository.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  dash:
    name: Dash package
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The tag is the one version string of the project (VERSION); refuse anything else.
      - name: Check tag matches VERSION
        run: |
          set -euo pipefail
          expected="v$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match VERSION: expected '${expected}'"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches VERSION"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # Before anything is built, because a tag with no notes is a mistake to catch while it is
      # still only a tag. The release body is this section; see scripts/changelog.ts.
      - name: Check the changelog has a section for the tag
        run: bun scripts/changelog.ts "${GITHUB_REF_NAME}" > /dev/null

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build dashboard packages
        run: bun run build

      - name: Upload dashboard packages
        uses: actions/upload-artifact@v4
        with:
          name: opendash-dash
          path: |
            build/*.simhubdash
            build/*.ledsprofile
            build/manifest.json
            build/fonts/*.ttf
            build/fonts/OFL.txt
          if-no-files-found: error

  plugin:
    name: SimHub plugin
    runs-on: ubuntu-latest
    needs: dash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download dashboard packages
        uses: actions/download-artifact@v4
        with:
          name: opendash-dash
          path: plugin/OpenDash/Resources/

      - name: Test plugin logic
        run: dotnet test plugin/OpenDash.Tests

      - name: Build plugin
        run: dotnet build plugin/OpenDash -c Release

      - name: Package plugin
        run: |
          set -euo pipefail
          if [ -f plugin/scripts/package-plugin.sh ]; then
            bash plugin/scripts/package-plugin.sh
          else
            mkdir -p build
            zip -j build/OpenDash-plugin.zip plugin/OpenDash/bin/Release/net48/OpenDash.dll plugin/INSTALL.md
          fi
          ls -l build/OpenDash-plugin.zip

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: opendash-plugin
          path: |
            build/OpenDash-plugin.zip
            plugin/OpenDash/bin/Release/net48/OpenDash.dll
          if-no-files-found: error

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: plugin
    permissions:
      contents: write
    steps:
      # This job builds nothing, and checks out only so that CHANGELOG.md is here to read.
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # The dash artifact is rooted at build/ (its paths share that ancestor), so it lands as
      # build/openDash.simhubdash. The plugin artifact is rooted at the repository, so downloading
      # it into the workspace restores build/OpenDash-plugin.zip.
      - name: Download dashboard packages
        uses: actions/download-artifact@v4
        with:
          name: opendash-dash
          path: build/

      - name: Download plugin
        uses: actions/download-artifact@v4
        with:
          name: opendash-plugin
          path: .

      - name: List release files
        run: ls -l build/

      # The release body is the changelog's own section for this tag, rather than GitHub's list of
      # pull request titles: CHANGELOG.md is written for a driver, and it is what README.md points
      # a reader at. The step before the build already refused a tag that has no section.
      - name: Take the release notes from the changelog
        run: bun scripts/changelog.ts "${GITHUB_REF_NAME}" --out release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.simhubdash
            build/*.ledsprofile
            build/OpenDash-plugin.zip
            build/fonts/OFL.txt
          body_path: release-body.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

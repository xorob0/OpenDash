# site-image.yml: builds site/Dockerfile and runs what comes out of it.
#
# Nothing else in the repository builds the image. ci.yml's Website job runs `cd site && bun run
# build` in a full checkout, where the whole tree is simply present, so it cannot see that the
# image's build stage is a hand-maintained subset of that tree. The first time the two disagreed
# the deploy failed at the last step of a build several minutes long, in front of whoever pressed
# Redeploy, over one missing COPY (#404). This job is where that disagreement surfaces instead.
#
# It builds only: no registry login, no push, nothing published. The image is loaded into the
# runner's daemon, run, and asked the three questions docs/deploy.md asks after a first deploy —
# the home page answers, the sitemap is not empty, the plugin zip is there — and then the three
# things the runtime stage assembles by hand, each of which is missing in an image whose every page
# still answers 200: the static folder the stylesheet comes from, the openssl that Prisma's query
# engine links, and a writable .next/cache. Those are the failures of this family that a build alone
# would not catch.
#
# Keep the steps in sync with the docker build line in docs/deploy.md.
name: Site image

# Only on the pushes that can break it. The paths are everything the image copies: the two build
# stages between them take packages/, design/, scripts/, tools/, data/, plugin/, media/, traces/,
# site/ and the root's manifests, so the list is most of the tree and a run is skipped only for a
# change to docs/ or the repository's own prose. That is the honest version of a path filter — a
# skipped run here means nothing the image reads has moved, rather than a green tick that proves
# nothing.
#
# On push and nothing else, unlike ci.yml above it. push and pull_request both fire for the same
# commit of a branch in this repository, in two concurrency groups that cannot cancel each other,
# so keeping both would build every commit twice — and ci.yml can afford that because its jobs are
# seconds, while this one is minutes, which is the cost #397 objected to in the first place. Each of
# those runs would also read a cache the other has not exported yet and then write over it. A pull
# request lists whatever checks its head commit already has, so the run this trigger starts is the
# run the pull request shows; what is given up is a pull request from a fork, which pushes nothing
# here and so gets no build. There are none, and a fork's build would be its own decision about
# running a fork's Dockerfile on this cache.
on:
  push:
    paths:
      - "site/**"
      - "packages/**"
      - "design/**"
      - "scripts/**"
      - "tools/**"
      - "data/**"
      - "plugin/**"
      - "media/**"
      - "traces/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "tsconfig.base.json"
      - "VERSION"
      - "CHANGELOG.md"
      - ".dockerignore"
      - ".github/workflows/site-image.yml"
  # So that a smoke build before a redeploy is one click, on whichever branch is about to be
  # published. Available once this file is on the default branch, which is where Actions reads the
  # dispatch list from.
  workflow_dispatch:

permissions:
  contents: read

# One run per branch; a newer push cancels the older. ci.yml keys this on the pull request number
# when there is one, because it runs on both events; this job runs on push alone, so the ref is the
# whole answer.
concurrency:
  group: site-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and serve
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # buildx rather than the daemon's own builder, for the layer cache below. `load: true` needs
      # it to hand the result to the daemon so the container can be run.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The first stage is `bun run package` across both toolchains, which is the several minutes
      # #397 did not want to pay on every push. This cache is the answer to that, so what it saves
      # belongs here as figures, each against the change that produced it. Measured on this runner,
      # for the build step:
      #
      #   nothing cached, a branch's first push          3m23s
      #   a change under site/                           2m05s  — 20s importing and extracting the
      #                                                           artifacts stage, 46s for the site's
      #                                                           install, generate and next build,
      #                                                           52s exporting the cache again
      #   nothing any COPY reads, e.g. this file alone      19s
      #
      # The last of those is the floor and not the common case: it was once recorded here as the warm
      # figure for a site-only change, which it is not. Note also that `COPY site ./site` copies
      # site/Dockerfile itself, so editing the Dockerfile is a change under site/. A change under
      # packages/ invalidates `bun run package` as well, which is the first row again.
      #
      # mode=max is what makes the artifacts stage reusable at all, and the 52s of export above is
      # what that costs; it is still the difference between 2m and 3m30s on the changes the site
      # actually gets. The cache is scoped per ref with a read-through to the default branch, so a
      # branch's first push reads what main last exported and writes its own. Export failures are
      # warnings: an evicted or unavailable cache makes the run slow, not red.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          # The repository root, not site/: stages 1 and 2 read most of the tree.
          context: .
          file: site/Dockerfile
          push: false
          load: true
          tags: opendash-site:ci
          # A reserved domain rather than the real one, because this image is thrown away at the
          # end of the job and the value is only here to prove the build argument is plumbed
          # through to the sitemap. An empty origin builds an empty sitemap by design.
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://opendash.invalid
          cache-from: type=gha,scope=site-image
          cache-to: type=gha,mode=max,scope=site-image,ignore-error=true

      - name: Start the container
        run: docker run -d --name opendash-site -p 3000:3000 opendash-site:ci

      # The image's own HEALTHCHECK fetches the same page; this waits for the second or so between
      # the process existing and Next answering, rather than trusting either.
      - name: Wait for it to answer
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then
              echo "serving"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the container did not answer / within 60 seconds"
          exit 1

      - name: The home page, its stylesheet, the sitemap and the downloads
        run: |
          set -euo pipefail

          # The pages are in the standalone output.
          curl -fsS -o home.html http://127.0.0.1:3000/
          test -s home.html

          # The static folder is copied into the runtime stage by hand, because Next leaves it out
          # of the standalone tree expecting a CDN. Without it every page still answers 200 and
          # arrives with no styling, so the stylesheet the home page asks for has to be fetched
          # rather than assumed.
          # head rather than grep -m1, because -m1 stops after the first matching LINE and Next
          # emits its markup as one, so -o would hand back every stylesheet at once. `|| true`
          # covers both ways the pipeline can fail while still being right: grep exiting empty
          # handed, and pipefail seeing the pipe head closed on a match it did find. Either way
          # what head printed is what is captured, and the message below reports an empty result.
          css="$(grep -o '/_next/static/css/[^"]*\.css' home.html | head -n1 || true)"
          if [ -z "$css" ]; then
            echo "::error::the home page links no stylesheet; the site's CSS is not being emitted"
            exit 1
          fi
          curl -fsS -o style.css "http://127.0.0.1:3000${css}"
          test -s style.css

          # Not empty is the whole check: the sitemap comes back as a bare <urlset> when the origin
          # was not given at build time, which is the quietest way this image goes wrong.
          curl -fsS -o sitemap.xml http://127.0.0.1:3000/sitemap.xml
          if ! grep -q '<loc>' sitemap.xml; then
            echo "::error::the sitemap lists no pages; NEXT_PUBLIC_SITE_URL did not reach the build"
            cat sitemap.xml
            exit 1
          fi

          # The artifacts stage ran and its output reached the public folder. This is the part with
          # the most moving pieces behind it, and the one a reader actually clicks.
          curl -fsS -o plugin.zip http://127.0.0.1:3000/downloads/OpenDash-plugin.zip
          unzip -l plugin.zip

          ls -l home.html style.css sitemap.xml plugin.zip

      # The runtime stage carries three comments about things it has to assemble by hand, and all
      # three failures leave every page answering 200, so the step above catches only the first of
      # them. Delete the openssl install and the debian-openssl-3.0.x engine the schema declares is
      # left with libssl.so.3 and libcrypto.so.3 unresolved, and Prisma warns that it cannot detect
      # the openssl version at all. Delete the .next/cache mkdir and next/image re-optimises every
      # capture on every request, logging an EACCES for each one. Both were checked against images
      # built that way: the four assertions above stayed green, and these two did not.
      #
      # What the first of those does not do is take the site down, which is worth knowing before
      # reading the failure: Prisma falls back to the openssl-1.1.x engine, and that engine answered
      # a query against a postgres with TLS and without it. So what this proves is that the image
      # runs the engine it was built to run, which is the thing that drifts.
      - name: What the runtime stage assembles by hand
        run: |
          set -euo pipefail

          # ldd exits 0 with unresolved entries listed, so it is the output that is read and not the
          # status; the status is only interesting when there is no engine to read at all. Of the two
          # engines Prisma ships it is the openssl-3.0.x one that bookworm selects, and the one that
          # links libssl.
          if ! linkage="$(docker exec opendash-site sh -c 'ldd node_modules/.prisma/client/libquery_engine-*.so.node' 2>&1)"; then
            echo "::error::the Prisma query engine is not in the image, so the survey cannot work"
            printf '%s\n' "$linkage"
            exit 1
          fi
          printf '%s\n' "$linkage"
          if printf '%s\n' "$linkage" | grep -q 'not found'; then
            echo "::error::the Prisma query engine has unresolved libraries; the runtime stage is missing its openssl install"
            exit 1
          fi

          # As the unprivileged user the image runs as, which is what the COPY --chown and the mkdir
          # in the runtime stage are both for: the directory can exist and still not be writable.
          if ! docker exec opendash-site sh -c '[ -d .next/cache ] && [ -w .next/cache ]'; then
            echo "::error::.next/cache is missing or unwritable; next/image will re-optimise every picture on every request"
            docker exec opendash-site sh -c 'ls -ld .next .next/cache' || true
            exit 1
          fi
          echo ".next/cache is writable"

      # Whatever the server said on the way down is the only account of a failure there is, since
      # the container goes with the runner.
      - name: What the container said
        if: failure()
        run: docker logs opendash-site || true

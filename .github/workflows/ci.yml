# ci.yml: builds and tests the dashboard package (Bun) and the SimHub plugin (.NET) on every push
# and pull request. The plugin job embeds the dash job's .simhubdash output, so it runs second, and
# the site job needs the same output to know which packages exist.
# The tools job builds the emulator and the trace recorder and runs the emulator's selfcheck; it
# needs nothing from the others and runs beside them.
# The affected job compares the built packages against the base and keeps one comment saying which
# of them a reviewer should look at; it too depends on no other job.
# The site's Docker image is not built here but in site-image.yml, which runs on a path filter: the
# site job below builds the site in a full checkout, where the whole tree is present, so it cannot
# see what the image's build stage forgot to copy.
# Spec: docs section 12. The plugin job is release.yml's, step for step, and
# scripts/workflows.test.ts fails when the two differ in anything but their comments.
name: CI

on:
  push:
  pull_request:

# Read-only by default. The affected job raises its own, because it keeps a comment; nothing in CI
# writes to the repository itself.
permissions:
  contents: read

# One run per branch or pull request; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dash:
    name: Dash package
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # On every pull request, not only on a tag: the release workflow finds a VERSION that
      # disagrees with CHANGELOG.md only once the tag is pushed, and the plugin installs a dashboard
      # only over an older one, so a number that did not move is a rig left on its old dashboard.
      # `bun run version <x.y.z>` writes both; see scripts/version.ts.
      # A branch can agree with itself and still have set the number back, by deleting the newer
      # sections along with it, so a pull request also holds VERSION to its base's. The checkout is
      # shallow, and the base commit is fetched alone for its VERSION.
      - name: Check VERSION against the changelog
        run: |
          set -euo pipefail
          if [ -n "$BASE" ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            bun run version --check --base "$BASE"
          else
            bun run version --check
          fi
        env:
          BASE: ${{ github.event.pull_request.base.sha }}

      - name: Typecheck
        run: bun run typecheck

      # The log of a red run says little once a rerun has gone green, and a test that timed out prints
      # no assertion at all, so the run keeps a JUnit report: every test's duration, and the failure
      # text of every test that failed, "test timed out" included. It is written outside the tree and
      # uploaded whether the tests passed or not; only a cancelled run has nothing to keep (#547).
      - name: Test
        run: bun test --reporter=junit --reporter-outfile="$RUNNER_TEMP/test-report.xml"

      - name: Upload the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: opendash-test-report
          path: ${{ runner.temp }}/test-report.xml
          if-no-files-found: warn

      - name: Build dashboard packages
        # Every theme, as the release builds: the plugin tests hold the embedded packages to the whole
        # catalogue, and a push to main or a plugin-only branch touches no theme.
        run: bun run build --all-themes

      - name: Upload dashboard packages
        uses: actions/upload-artifact@v4
        with:
          name: opendash-dash
          path: |
            build/*.simhubdash
            build/*.ledsprofile
            build/flag-box-glyphs.json
            build/flag-box.svg
            build/manifest.json
            build/fonts/*.ttf
          if-no-files-found: error

  plugin:
    name: SimHub plugin
    runs-on: ubuntu-latest
    needs: dash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The plugin embeds Resources/*.simhubdash, the .ledsprofile and flag-box-glyphs.json (all
      # gitignored); take them from the dash job. flag-box.svg rides along as the contact sheet a
      # reviewer looks at; it is not embedded, and the csproj only takes the files it names.
      - name: Download dashboard packages
        uses: actions/download-artifact@v4
        with:
          name: opendash-dash
          path: plugin/OpenDash/Resources/

      # The csproj embeds the glyph sheet only where it exists, so a plugin built without it loads and
      # draws its flag box previews bare. if-no-files-found counts the upload list as a whole, so
      # this is the check that the one file arrived (#503).
      - name: Check the flag box glyphs arrived
        run: test -s plugin/OpenDash/Resources/flag-box-glyphs.json

      # As a release does, and before the tests, so the plugin tested here reads its profiles through
      # FlagBoxProfile's gzip path, the one a user's plugin takes (#628).
      - name: Compress the LED profiles
        run: bash plugin/scripts/compress-profiles.sh

      - name: Test plugin logic
        run: dotnet test plugin/OpenDash.Tests

      - name: Build plugin
        run: dotnet build plugin/OpenDash -c Release

      # Always the script, never a hand-rolled zip: it is what puts the font licence beside the DLL.
      - name: Package plugin
        run: |
          set -euo pipefail
          bash plugin/scripts/package-plugin.sh
          ls -l build/OpenDash-plugin.zip

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: opendash-plugin
          path: |
            build/OpenDash-plugin.zip
            plugin/OpenDash/bin/Release/net48/OpenDash.dll
          if-no-files-found: error

  # The C# tools of the dev loop, which nothing else compiles: the emulator `bun run dev` starts on
  # the VM and the trace recorder `bun run record` installs there. Without this job a change that
  # breaks either surfaces only when somebody next drives the VM (#628). The emulator's deliverable
  # is net48 and runs only on Windows; devcheck builds the same sources for net8.0, which is what
  # runs the selfcheck here, on the flag box scenario docs/dev-loop.md names.
  tools:
    name: Dev tools
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the emulator
        run: dotnet build tools/irsdk-emulator -c Release

      - name: Build the emulator for Linux
        run: dotnet build tools/irsdk-emulator/devcheck -c Release

      - name: Self-check the emulator
        working-directory: tools/irsdk-emulator
        run: dotnet devcheck/bin/Release/net8.0/IrsdkEmulator.dll --selfcheck flagbox

      - name: Build the trace recorder
        run: dotnet build tools/trace-recorder -c Release

  site:
    name: Website
    runs-on: ubuntu-latest
    # It needs build/manifest.json to know which packages exist, and the dash job already makes one.
    needs: dash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # site/ is not a workspace of the root package.json and keeps its own lockfile, so the root
      # install does not reach it. Both are needed: the content generator imports the module
      # catalogue through the root workspace.
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd site && bun install --frozen-lockfile

      - name: Download dashboard packages
        uses: actions/download-artifact@v4
        with:
          name: opendash-dash
          path: build/

      # Both of these run the generators first, because tokens.css and content.generated.ts are
      # generated from the repository and gitignored; a typecheck without them fails on an import of
      # a file that has never existed.
      - name: Typecheck
        run: cd site && bun run typecheck

      # next build is the step that catches a page referring to a token, a package or a module that
      # no longer exists.
      - name: Build
        run: cd site && bun run build

  affected:
    name: Affected packages
    runs-on: ubuntu-latest
    # Only a pull request has a base to compare against and a comment to keep.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The whole history: the comparison builds the commit this branch forked from, and a shallow
      # clone does not contain it.
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # fflate is borrowed by the base build rather than installed a second time; see
      # linkDependencies in scripts/affected.ts.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compare the branch against its base
        run: bun run affected --base "$BASE" > affected.md
        env:
          BASE: ${{ github.event.pull_request.base.sha }}

      # Always readable from the run itself, which is what a pull request from a fork gets: the
      # pull_request token is read-only there, so the comment below cannot be written.
      - name: Write the report to the run summary
        run: cat affected.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep one comment on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('affected.md', 'utf8').trim();
            // Must match COMMENT_MARKER in scripts/affected.ts, which is where it is defined.
            const marker = '<!-- opendash:affected -->';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const mine = comments.find((c) => c.user?.type === 'Bot' && (c.body ?? '').includes(marker));

            try {
              if (body === '') {
                // Neither a package nor an LED profile moved. A comment left from an earlier push
                // would now be a lie, so it goes rather than being updated to say nothing.
                if (mine) await github.rest.issues.deleteComment({ ...context.repo, comment_id: mine.id });
                core.info('no package or LED profile moved; nothing posted');
                return;
              }
              if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
              else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            } catch (error) {
              // A fork's token cannot write. The run summary already carries the report, so this is
              // reported and not failed.
              core.warning(`could not keep the comment: ${error.message}`);
            }
